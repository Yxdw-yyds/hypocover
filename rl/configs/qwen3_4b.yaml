# Method B default run. Tuned for 1 training GPU (24 GB) + 1 vLLM GPU.
model: Qwen/Qwen3-4B-Instruct-2507        # non-thinking instruct model
train_file: data/rl/train.jsonl

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  task_type: CAUSAL_LM

grpo:
  output_dir: checkpoints/qwen3_4b_cov
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4        # 32 completions / step = 4 prompts x 8
  num_generations: 8                    # group size G
  max_prompt_length: 3072
  max_completion_length: 384
  temperature: 1.0
  beta: 0.0                             # no KL term (LoRA keeps us close)
  loss_type: dr_grpo
  max_steps: 400
  bf16: true
  gradient_checkpointing: true
  use_vllm: true
  vllm_mode: server
  logging_steps: 5
  save_steps: 50
  save_total_limit: 4
  log_completions: true
  report_to: none                       # set to wandb if the team uses it
  seed: 0
